<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sto. Niño Chapel Finance System Online Tracker</title>
<style>
body{margin:0;font-family:Arial;background:#eef2ee;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px}
.header{background:#1b5e20;color:#fff;border-radius:16px;padding:20px;text-align:center}
button{border:none;padding:14px;border-radius:10px;color:#fff;font-weight:700;width:100%;margin:5px 0}
.blue{background:#1565c0}.orange{background:#ef6c00}.gray{background:#757575}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:5px 0;box-sizing:border-box}
</style>
</head>
<body>
<div class="header"><h2>Sto. Niño Chapel Finance System<br>Online Tracker</h2><p>V12 TINY TEST</p></div>
<div class="card">
<h3 style="text-align:center">Login</h3>
<input value="treasurer@stonino.com">
<input type="password" placeholder="Password">
<button class="blue" onclick="doLogin()">LOGIN</button>
<p id="msg" style="text-align:center;color:red;font-weight:700"></p>
<button class="orange" onclick="enterPublic()">PUBLIC VIEW - Tingin Lang</button>
<p id="debug" style="text-align:center;color:#888;font-size:12px">JS: Naglo-load...</p>
<button class="gray" onclick="testJS()">TEST - Pindutin mo</button>
</div>
<div id="mainApp" style="display:none" class="card">
<h2>🎉 GUMANA NA!</h2>
<p>Buhay na yung JavaScript mo!</p>
<p>Dashboard mo dito na ilalagay.</p>
<button class="blue" onclick="backToLogin()">BACK TO LOGIN</button>
</div>
<script>
function testJS(){ alert('JS GUMANA! Buhay na!'); document.getElementById('debug').textContent='JS: BUHAY! GUMANA!'; document.getElementById('msg').textContent='TEST OK!'; }
function enterPublic(){ alert('PUBLIC VIEW GUMANA!'); document.getElementById('msg').textContent='PUBLIC VIEW GUMANA!'; document.getElementById('mainApp').style.display='block'; }
function doLogin(){ alert('LOGIN BUTTON GUMANA! Firebase na lang kulang.'); document.getElementById('msg').textContent='LOGIN BUTTON GUMANA!'; }
function backToLogin(){ document.getElementById('mainApp').style.display='none'; }
document.getElementById('debug').textContent='JS: BUHAY! V12 loaded.';
</script>
</body>
</html>
