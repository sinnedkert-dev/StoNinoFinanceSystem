<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sto. Nino Chapel - VB Bago</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#eef2ee;padding:12px;padding-bottom:110px;color:#222}
.header-top{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;border-radius:18px;padding:18px 16px;text-align:center;box-shadow:0 4px 14px rgba(27,94,32,.25);margin-bottom:12px}
.header-top h2{margin:0;font-size:22px;letter-spacing:.5px}
.header-top p{margin:4px 0 0;opacity:.9;font-size:13px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input,select,textarea{width:100%;padding:13px;border:1.5px solid #e0e0e0;border-radius:10px;margin:5px 0;font-size:15px;background:#fcfcfc}
input:focus,select:focus{outline:none;border-color:#2e7d32;background:#fff}
button{border:none;padding:13px;border-radius:10px;color:#fff;cursor:pointer;font-weight:700;margin:4px 0;font-size:14px}
.green{background:#2e7d32}.red{background:#c62828}.blue{background:#1565c0}.orange{background:#ef6c00}.gray{background:#757575}
.hidden{display:none}
.balance{font-size:36px;font-weight:900;color:#1b5e20;line-height:1;margin:6px 0}
.mini{display:flex;gap:10px;margin-top:12px}
.mini div{flex:1;background:#f1f8e9;border-radius:12px;padding:12px 6px;text-align:center}
.mini small{color:#666;font-size:11px;letter-spacing:.5px}
.mini b{display:block;margin-top:4px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.thumb{width:90px;height:90px;object-fit:cover;border-radius:10px;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:14px;word-break:break-all}
.top small{color:#2e7d32;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;overflow-x:auto;box-shadow:0 -2px 12px rgba(0,0,0,.12);padding:6px 4px;z-index:99;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;background:none;color:#777;font-size:12px;padding:10px 14px;border-radius:20px;white-space:nowrap;margin:0 2px}
.nav button.active{color:#fff;background:#2e7d32}
h3{margin:0 0 10px;font-size:17px}
.login-card{max-width:420px;margin:30px auto}
.login-card input{padding:14px}
</style>
</head>
<body>
<div id="loginPage" class="card login-card">
<div class="header-top" style="margin:-16px -16px 16px"><h2>STO. NIÑO CHAPEL</h2><p>VB BAGO - BUD NA</p></div>
<h3 style="text-align:center;font-size:20px">Login</h3>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">
<button id="loginBtn" class="blue" style="width:100%">LOGIN</button>
<p id="loginError" style="color:red;text-align:center;min-height:18px"></p>
<button id="enterPublic" class="orange" style="width:100%">PUBLIC VIEW - Tingin Lang</button>
</div>

<div id="mainApp" class="hidden">
<div class="card top"><div><b id="userEmail">USER</b><br><small id="userRoleLabel">MEMBER</small></div><div style="display:flex;gap:6px;flex-shrink:0"><button id="copyLinkBtn" class="blue" style="padding:9px 12px">Copy Link</button><button id="logoutBtn" class="red" style="padding:9px 12px">Logout</button></div></div>
<div class="card"><h3>Dashboard</h3><div id="totalBalance" class="balance">₱0.00</div><div class="mini"><div><small>CASH IN</small><b id="totalIn">₱0</b></div><div><small>CASH OUT</small><b id="totalOut">₱0</b></div><div><small>PENDING</small><b id="totalPending">0</b></div></div><div id="notifBar" style="margin-top:10px;font-size:13px;color:#e65100;font-weight:600"></div></div>
<div id="page-Dashboard" class="card"><h3>Recent</h3><div id="recentTx">Wala pa.</div></div>
<div id="page-Cash" class="hidden card"><h3>Cash - Add Transaction</h3>
<div style="display:flex;gap:8px"><button id="typeInBtn" class="green" style="flex:1" onclick="setTxType('in')">CASH IN</button><button id="typeOutBtn" class="red" style="flex:1" onclick="setTxType('out')">CASH OUT</button></div>
<input id="txAmount" type="number" placeholder="Halaga">
<select id="txCategory"><option>Mass Offering</option><option>Pondo</option><option>Fiesta</option><option>Donation</option><option>Expense</option><option>Others</option></select>
<input id="txPerson" placeholder="Pangalan">
<input id="txNote" placeholder="Note">
<input id="receiptInput" type="file" accept="image/*">
<div id="receiptPreview"></div>
<button id="saveTxBtn" class="green" style="width:100%">SAVE - PENDING</button>
<h4 style="margin:16px 0 4px">Budget Target</h4><input id="budgetTarget" type="number" placeholder="Target"><button id="saveBudgetBtn" class="blue" style="width:100%">SET BUDGET</button>
</div>
<div id="page-Approval" class="hidden card"><h3>Approval - AUDITOR LANG</h3><div id="pendingList"></div></div>
<div id="page-Pledge" class="hidden card"><h3>Pledge Tracker</h3><input id="pledgeName" placeholder="Pangalan"><input id="pledgeAmount" type="number" placeholder="Halaga"><button id="addPledgeBtn" class="green" style="width:100%">ADD PLEDGE</button><div id="pledgeList" style="margin-top:10px"></div></div>
<div id="page-Report" class="hidden card"><h3>Report</h3><select id="reportMonth"></select><div id="reportList"></div></div>
<div id="page-Public" class="hidden card"><h3>Public View</h3><div id="publicList"></div></div>
<div id="page-Members" class="hidden card"><h3>Members</h3><input id="memberName" placeholder="Pangalan"><input id="memberContact" placeholder="Contact"><button id="addMemberBtn" class="blue" style="width:100%">ADD MEMBER</button><div id="memberList" style="margin-top:10px"></div></div>
<div id="page-Audit" class="hidden card"><h3>Audit Log</h3><div id="auditList"></div></div>
<div id="page-Settings" class="hidden card"><h3>Settings</h3><input id="settingGcash" placeholder="GCash Number"><input id="settingGcashName" placeholder="GCash Name"><button id="saveSettingsBtn" class="blue" style="width:100%">SAVE SETTINGS</button><br><br><button id="downloadBackupBtn" class="gray" style="width:100%">DOWNLOAD BACKUP</button><br><button id="toggleLockBtn" class="orange" style="width:100%">LOCK / UNLOCK MONTH</button><br><button id="wipeBtn" class="red" style="width:100%">DELETE LAHAT</button></div>
<div class="nav" id="bottomNav">
<button data-page="Dashboard" onclick="showPage('Dashboard')" class="active">Dashboard</button>
<button data-page="Cash" onclick="showPage('Cash')">Cash</button>
<button data-page="Approval" onclick="showPage('Approval')">Approval</button>
<button data-page="Pledge" onclick="showPage('Pledge')">Pledge</button>
<button data-page="Report" onclick="showPage('Report')">Report</button>
<button data-page="Public" onclick="showPage('Public')">Public</button>
<button data-page="Members" onclick="showPage('Members')">Members</button>
<button data-page="Audit" onclick="showPage('Audit')">Audit</button>
<button data-page="Settings" onclick="showPage('Settings')">Settings</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD8XqSU5tlx5gVKBNJjIvrkfqwiTbaeSuw",
  authDomain: "stoninochapelfinance.firebaseapp.com",
  databaseURL: "https://stoninochapelfinance-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stoninochapelfinance",
  storageBucket: "stoninochapelfinance.firebasestorage.app",
  messagingSenderId: "633724409478",
  appId: "1:633724409478:web:a01f4e934d836ce3c82307",
  measurementId: "G-7WCS0PJWY6"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let currentUserEmail = "";
let currentRole = "MEMBER";
let allTransactions = {};
let allMembers = {};
let allBudgets = {};
let allAudit = {};
let allPledges = {};
let allSettings = {};
let allLocked = {};
let currentTxType = "in";
let receiptBase64 = "";
let isPublicMode = false;
function fmt(n){ return Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2}); }
function setEl(id,v){ const e=document.getElementById(id); if(e) e.textContent=v; }
function dLabel(ts){ if(!ts) return ''; return new Date(ts).toLocaleString('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }
window.setTxType = function(t){ currentTxType=t; document.getElementById('typeInBtn').style.opacity = t==='in'?'1':'0.6'; document.getElementById('typeOutBtn').style.opacity = t==='out'?'1':'0.6'; };
window.showPage = function(p){
  if(isPublicMode && p!=='Public'){ alert('Naka-Public ka. Mag-login ka muna.'); return; }
  const pages=['Dashboard','Cash','Approval','Pledge','Report','Public','Members','Audit','Settings'];
  pages.forEach(x=>{ const e=document.getElementById('page-'+x); if(e) e.classList.toggle('hidden', x!==p); });
  document.querySelectorAll('.nav button').forEach(b=>{ b.classList.toggle('active', b.dataset.page===p); });
  if(p==='Report') fillMonths();
  if(p==='Public') renderPublic();
};
window.enterPublic = function(){
  isPublicMode=true;
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('bottomNav').classList.add('hidden');
  setEl('userEmail','PUBLIC VIEWER');
  setEl('userRoleLabel','Tingin lang');
  loadData();
  showPage('Public');
};
window.copyPublicLink = function(){ navigator.clipboard.writeText(window.location.href); alert('Na-copy na!'); };
onAuthStateChanged(auth, (user)=>{
  if(!user) return;
  currentUserEmail=user.email;
  const em=user.email.toLowerCase();
  if(em.includes('treasurer')) currentRole='TREASURER';
  else if(em.includes('auditor') || em.includes('pari')) currentRole='AUDITOR';
  else currentRole='MEMBER';
  isPublicMode=false;
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('bottomNav').classList.remove('hidden');
  setEl('userEmail',user.email);
  setEl('userRoleLabel','Role: '+currentRole+' - VB BAGO');
  loadData();
  showPage('Dashboard');
});
function loadData(){
  onValue(ref(db,'transactions'), s=>{ allTransactions=s.val()||{}; renderAll(); });
  onValue(ref(db,'members'), s=>{ allMembers=s.val()||{}; renderAll(); });
  onValue(ref(db,'budgets'), s=>{ allBudgets=s.val()||{}; renderAll(); });
  onValue(ref(db,'audit'), s=>{ allAudit=s.val()||{}; renderAll(); });
  onValue(ref(db,'pledges'), s=>{ allPledges=s.val()||{}; renderAll(); });
  onValue(ref(db,'settings'), s=>{ allSettings=s.val()||{}; renderAll(); });
  onValue(ref(db,'lockedMonths'), s=>{ allLocked=s.val()||{}; renderAll(); });
}
function arr(obj){ return Object.entries(obj||{}).map(([id,v])=>({id,...v})); }
function renderAll(){
  const txs=arr(allTransactions);
  const approved=txs.filter(t=>t.status==='approved');
  const pending=txs.filter(t=>t.status==='pending');
  const sumIn=approved.filter(t=>t.type==='in').reduce((a,t)=>a+Number(t.amount||0),0);
  const sumOut=approved.filter(t=>t.type==='out').reduce((a,t)=>a+Number(t.amount||0),0);
  setEl('totalBalance','₱'+fmt(sumIn-sumOut));
  setEl('totalIn','₱'+fmt(sumIn));
  setEl('totalOut','₱'+fmt(sumOut));
  setEl('totalPending',pending.length);
  const notif=document.getElementById('notifBar');
  if(currentRole==='AUDITOR' && pending.length>0) notif.textContent='NOTIF: May '+pending.length+' PENDING na i-approve!';
  else if(pending.length>0) notif.textContent='May '+pending.length+' pending - hintay Auditor.';
  else notif.textContent='';
  let html='';
  txs.sort((a,b)=>b.timestamp-a.timestamp).slice(0,5).forEach(t=>{ html+=`<div class="row" style="border-bottom:1px solid #eee;padding:8px 0"><span>${t.person||''} - ${t.category||''}<br><small style="color:#888">${dLabel(t.timestamp)} - ${t.status}</small></span><b>${t.type==='in'?'+':'-'}₱${fmt(t.amount)}</b></div>`; });
  document.getElementById('recentTx').innerHTML=html||'Wala pa.';
  let pHtml='';
  pending.forEach(t=>{ pHtml+=`<div class="card" style="margin:6px 0"><b>${t.person}</b> - ₱${fmt(t.amount)} - ${t.category}<br><small>${t.note||''}</small><br>`; if(currentRole==='AUDITOR') pHtml+=`<button class="green" onclick="approveTx('${t.id}')">APPROVE</button> <button class="red" onclick="rejectTx('${t.id}')">REJECT</button>`; else pHtml+=`<span>Si AUDITOR lang</span>`; if(currentRole==='AUDITOR') pHtml+=` <button class="red" onclick="deleteTx('${t.id}')">DELETE</button>`; pHtml+=`</div>`; });
  document.getElementById('pendingList').innerHTML=pHtml||'Wala pang pending.';
  let mHtml=''; arr(allMembers).forEach(m=>{ mHtml+=`<div class="row" style="border-bottom:1px solid #eee;padding:8px 0"><span>${m.name}<br><small>${m.contact||''}</small></span><button class="red" onclick="deleteMember('${m.id}')" style="padding:6px 10px">DELETE</button></div>`; }); document.getElementById('memberList').innerHTML=mHtml||'Wala pa.';
  let plHtml=''; arr(allPledges).forEach(p=>{ plHtml+=`<div class="row" style="border-bottom:1px solid #eee;padding:8px 0"><span>${p.name} - ₱${fmt(p.amount)}<br><small>${p.paid?'PAID':'PENDING'}</small></span><span><button class="green" onclick="markPledgePaid('${p.id}')" style="padding:6px 10px">PAID</button> <button class="red" onclick="deletePledge('${p.id}')" style="padding:6px 10px">X</button></span></div>`; }); document.getElementById('pledgeList').innerHTML=plHtml||'Wala pa.';
  let aHtml=''; arr(allAudit).sort((a,b)=>b.timestamp-a.timestamp).slice(0,20).forEach(a=>{ aHtml+=`<div style="border-bottom:1px solid #eee;padding:6px 0"><small>${dLabel(a.timestamp)} - ${a.by} - ${a.action} - ${a.detail||''}</small></div>`; }); document.getElementById('auditList').innerHTML=aHtml||'Wala pa.';
  renderPublic();
}
function renderPublic(){
  const txs=arr(allTransactions).filter(t=>t.status==='approved').sort((a,b)=>b.timestamp-a.timestamp);
  let html=''; txs.slice(0,20).forEach(t=>{ html+=`<div class="row" style="border-bottom:1px solid #eee;padding:8px 0"><span>${t.category} - ${t.person}<br><small>${dLabel(t.timestamp)}</small></span><b>${t.type==='in'?'+':'-'}₱${fmt(t.amount)}</b></div>`; });
  const el=document.getElementById('publicList'); if(el) el.innerHTML=html||'Wala pang approved.';
}
window.approveTx=async function(id){ if(currentRole!=='AUDITOR') return alert('AUDITOR lang!'); await update(ref(db,'transactions/'+id),{status:'approved',approvedBy:currentUserEmail,approvedAt:Date.now()}); };
window.rejectTx=async function(id){ if(currentRole!=='AUDITOR') return alert('AUDITOR lang!'); await update(ref(db,'transactions/'+id),{status:'rejected'}); };
window.deleteTx=async function(id){ if(currentRole!=='AUDITOR') return alert('AUDITOR lang!'); if(confirm('Burahin?')) await remove(ref(db,'transactions/'+id)); };
window.deleteMember=async function(id){ if(confirm('Burahin?')) await remove(ref(db,'members/'+id)); };
window.markPledgePaid=async function(id){ await update(ref(db,'pledges/'+id),{paid:true,paidAt:Date.now()}); };
window.deletePledge=async function(id){ if(confirm('Burahin?')) await remove(ref(db,'pledges/'+id)); };
document.getElementById('saveBudgetBtn').addEventListener('click', async ()=>{ const v=document.getElementById('budgetTarget').value; if(!v) return alert('Lagyan ng target!'); await set(ref(db,'budgets/target'),{target:Number(v),updatedAt:Date.now(),by:currentUserEmail}); alert('Na-save!'); });
document.getElementById('saveTxBtn').addEventListener('click', async ()=>{ const amount=Number(document.getElementById('txAmount').value); const person=document.getElementById('txPerson').value.trim(); if(!amount || !person) return alert('Lagyan ng halaga at Pangalan!'); await push(ref(db,'transactions'),{amount,type:currentTxType,category:document.getElementById('txCategory').value,person,note:document.getElementById('txNote').value,receipt:receiptBase64,status:'pending',createdAt:Date.now(),timestamp:Date.now(),by:currentUserEmail}); alert('Na-save - PENDING'); document.getElementById('txAmount').value=''; document.getElementById('txPerson').value=''; document.getElementById('txNote').value=''; });
document.getElementById('addMemberBtn').addEventListener('click', async ()=>{ const name=document.getElementById('memberName').value.trim(); const contact=document.getElementById('memberContact').value.trim(); if(!name) return alert('Lagyan ng pangalan!'); await push(ref(db,'members'),{name,contact,createdAt:Date.now(),by:currentUserEmail}); alert('Na-add si '+name); document.getElementById('memberName').value=''; document.getElementById('memberContact').value=''; });
document.getElementById('addPledgeBtn').addEventListener('click', async ()=>{ const name=document.getElementById('pledgeName').value.trim(); const amount=Number(document.getElementById('pledgeAmount').value); if(!name || !amount) return alert('Lagyan ng pangalan at halaga!'); await push(ref(db,'pledges'),{name,amount,paid:false,createdAt:Date.now(),by:currentUserEmail}); alert('Na-add pledge ni '+name); document.getElementById('pledgeName').value=''; document.getElementById('pledgeAmount').value=''; });
document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{ const g=document.getElementById('settingGcash').value.trim(); const gn=document.getElementById('settingGcashName').value.trim(); await set(ref(db,'settings/gcash'),{gcashNumber:g,gcashName:gn}); alert('Na-save!'); });
document.getElementById('downloadBackupBtn').addEventListener('click', ()=>{ const data={transactions:allTransactions,members:allMembers,budgets:allBudgets,audit:allAudit,pledges:allPledges}; const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='stnino-backup.json'; a.click(); });
document.getElementById('toggleLockBtn').addEventListener('click', async ()=>{ const k=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'); const locked=allLocked[k]; await set(ref(db,'lockedMonths/'+k),!locked); alert(locked?'Na-UNLOCK':'Na-LOCK'); });
document.getElementById('wipeBtn').addEventListener('click', async ()=>{ if(currentRole!=='AUDITOR') return alert('AUDITOR lang pwede!'); if(!confirm('Sigurado ka?')) return; await remove(ref(db,'transactions')); await remove(ref(db,'members')); await remove(ref(db,'audit')); await remove(ref(db,'pledges')); await remove(ref(db,'lockedMonths')); alert('Nabura na lahat!'); });
document.getElementById('receiptInput').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ receiptBase64=ev.target.result; document.getElementById('receiptPreview').innerHTML=`<img src="${receiptBase64}" class="thumb">`; }; r.readAsDataURL(f); });
function fillMonths(){ const sel=document.getElementById('reportMonth'); if(!sel || sel.options.length) return; let keys=[...new Set(arr(allTransactions).map(t=>new Date(t.timestamp).getFullYear()+'-'+String(new Date(t.timestamp).getMonth()+1).padStart(2,'0')) )]; keys.sort().reverse().forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=new Date(k+'-01').toLocaleString('en-PH',{month:'long',year:'numeric'}); sel.appendChild(o); }); sel.addEventListener('change', ()=>{ const k=sel.value; const list=arr(allTransactions).filter(t=> (new Date(t.timestamp).getFullYear()+'-'+String(new Date(t.timestamp).getMonth()+1).padStart(2,'0'))===k && t.status==='approved'); let html=''; list.forEach(t=>{ html+=`<div class="row"><span>${t.person} - ${t.category}</span><b>${t.type==='in'?'+':'-'}₱${fmt(t.amount)}</b></div>`; }); document.getElementById('reportList'
