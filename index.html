<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sto. Nino Chapel Finance</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>body{margin:0;font-family:Arial;padding:12px;background:#eef2ee} .box{background:#fff;border-radius:16px;padding:16px;margin:12px 0} input,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd} button{border:none;padding:12px;border-radius:10px;color:#fff;font-weight:700;margin:4px 0} .green{background:#2e7d32}.red{background:#c62828}.blue{background:#1565c0}.orange{background:#ef6c00}.gray{background:#757575} .hidden{display:none} .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;overflow-x:auto;padding:6px} .nav button{background:none;color:#777} .nav button.on{color:#fff;background:#2e7d32} .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}</style>
</head>
<body>
<div id="loginPage" class="box" style="max-width:420px;margin:30px auto">
<h2 style="text-align:center">Sto. Nino Chapel<br>Finance System</h2>
<p style="text-align:center;font-size:12px">V22 FINAL - MAIGSI - BUO NA</p>
<input id="loginEmail" value="treasurer@stonino.com">
<input id="loginPass" type="password" placeholder="Password">
<button class="blue" style="width:100%" onclick="doLogin()">LOGIN</button>
<p id="loginError" style="color:red;text-align:center"></p>
<button class="orange" style="width:100%" onclick="enterPublic()">PUBLIC VIEW - Tingin Lang</button>
<p id="debugMsg" style="text-align:center;color:#888;font-size:11px">JS: Naglo-load...</p>
</div>
<div id="mainApp" class="hidden">
<div class="box"><b id="userEmail">USER</b><br><small id="userRoleLabel"></small><br><button class="red" onclick="doLogout()">Logout</button></div>
<div class="box"><h3>Dashboard</h3><div id="totalBalance" style="font-size:32px;font-weight:900;color:#1b5e20">P0.00</div><div>In: <b id="totalIn">P0.00</b> | Out: <b id="totalOut">P0.00</b> | Pending: <b id="totalPending">0</b></div><div id="notifBar" style="color:#e65100"></div></div>
<div id="page-Dashboard" class="box"><h3>Recent - Last 5</h3><div id="recentTx">Wala pa.</div></div>
<div id="page-Cash" class="box hidden"><h3>Cash - Add</h3><button class="green" onclick="setTx('in')">CASH IN</button> <button class="red" onclick="setTx('out')">CASH OUT</button><input id="txAmount" type="number" placeholder="Halaga"><select id="txCategory"><option>Mass Offering</option><option>Pondo</option><option>Fiesta</option><option>Donation</option><option>Expense</option><option>Others</option></select><input id="txPerson" placeholder="Pangalan"><input id="txNote" placeholder="Note"><button class="green" style="width:100%" onclick="saveTx()">SAVE - PENDING</button></div>
<div id="page-Approval" class="box hidden"><h3>Approval - AUDITOR LANG</h3><div id="pendingList"></div></div>
<div id="page-Public" class="box hidden"><h3>Public - Approved Lang</h3><div id="publicTotals"></div><div id="publicList"></div></div>
<div id="page-Members" class="box hidden"><h3>Members</h3><input id="memberName" placeholder="Pangalan"><input id="memberContact" placeholder="Contact"><button class="blue" style="width:100%" onclick="addMember()">ADD MEMBER</button><div id="memberList"></div></div>
<div id="page-Settings" class="box hidden"><h3>Settings</h3><input id="settingGcash" placeholder="GCash Number"><input id="settingGcashName" placeholder="GCash Name"><button class="blue" style="width:100%" onclick="saveSettings()">SAVE SETTINGS</button><br><br><button class="gray" style="width:100%" onclick="downloadBackup()">DOWNLOAD BACKUP</button><br><button class="red" style="width:100%" onclick="wipeAll()">DELETE LAHAT</button></div>
<div class="nav"><button data-page="Dashboard" onclick="showPage('Dashboard')" class="on">Dashboard</button><button data-page="Cash" onclick="showPage('Cash')">Cash</button><button data-page="Approval" onclick="showPage('Approval')">Approval</button><button data-page="Public" onclick="showPage('Public')">Public</button><button data-page="Members" onclick="showPage('Members')">Members</button><button data-page="Settings" onclick="showPage('Settings')">Settings</button></div>
</div>
<script>
document.getElementById('debugMsg').textContent = 'JS: BUHAY! V22 loaded.';
var curEmail = '';
var curRole = 'MEMBER';
var TX = {};
var MB = {};
var ST = {};
var txType = 'in';
var isPub = false;
var auth = null;
var db = null;
var fOK = false;
function fmt(n){ return Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2}); }
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dLabel(t){ if(!t) return ''; return new Date(t).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function showPage(p){ var pages = ['Dashboard','Cash','Approval','Public','Members','Settings']; for(var i=0;i<pages.length;i++){ var e=document.getElementById('page-'+pages[i]); if(e) e.style.display = (pages[i]===p ? 'block' : 'none'); } var btns=document.querySelectorAll('.nav button'); for(var j=0;j<btns.length;j++){ if(btns[j].getAttribute('data-page')===p) btns[j].className='on'; else btns[j].className=''; } }
function enterPublic(){ isPub=true; document.getElementById('loginPage').style.display='none'; document.getElementById('mainApp').classList.remove('hidden'); document.getElementById('userEmail').textContent='PUBLIC VIEWER'; document.getElementById('userRoleLabel').textContent='Tingin lang - V22'; renderAll(); showPage('Public'); }
function doLogout(){ if(auth) auth.signOut().then(function(){ location.reload(); }); else location.reload(); }
function setTx(t){ txType=t; }
function doLogin(){ var err=document.getElementById('loginError'); if(!fOK){ err.textContent='Firebase hindi pa nag-load. Refresh mo.'; return; } var em=document.getElementById('loginEmail').value.trim(); var ps=document.getElementById('loginPass').value; if(!em||!ps){ err.textContent='Lagyan ng Email at Password!'; return; } err.textContent='Naglo-login...'; auth.signInWithEmailAndPassword(em,ps).then(function(){ err.textContent=''; }).catch(function(e){ if(e.code==='auth/invalid-credential') err.textContent='Mali ang Email o Password!'; else err.textContent='Error: '+e.code; }); }
function forgotPass(){ var em=document.getElementById('loginEmail').value.trim(); if(!em) return alert('Lagyan ng Email!'); auth.sendPasswordResetEmail(em).then(function(){ alert('Na-send na reset link'); }); }
function loadData(){ if(!fOK) return; db.ref('transactions').limitToLast(100).on('value',function(s){ TX=s.val()||{}; renderAll(); }); db.ref('members').on('value',function(s){ MB=s.val()||{}; renderAll(); }); db.ref('settings').on('value',function(s){ ST=s.val()||{}; renderAll(); }); }
function arr(o){ var out=[]; var keys=Object.keys(o||{}); for(var i=0;i<keys.length;i++){ var v={}; var src=o[keys[i]]||{}; var ks=Object.keys(src); for(var j=0;j<ks.length;j++){ v[ks[j]]=src[ks[j]]; } v.id=keys[i]; out.push(v); } return out; }
function renderAll(){ var txs=arr(TX); txs.sort(function(a,b){ return (b.timestamp||0)-(a.timestamp||0); }); var si=0; var so=0; var pd=0; for(var i=0;i<txs.length;i++){ if(txs[i].status==='approved' && txs[i].type==='in') si+=Number(txs[i].amount||0); if(txs[i].status==='approved' && txs[i].type==='out') so+=Number(txs[i].amount||0); if(txs[i].status==='pending') pd++; } document.getElementById('totalBalance').textContent='P'+fmt(si-so); document.getElementById('totalIn').textContent='P'+fmt(si); document.getElementById('totalOut').textContent='P'+fmt(so); document.getElementById('totalPending').textContent=pd; var h=''; var lim=txs.length>5?5:txs.length; for(var r=0;r<lim;r++){ h+='<div class="row"><span>'+esc(txs[r].person)+' - '+esc(txs[r].category)+'</span><b>P'+fmt(txs[r].amount)+'</b></div>'; } document.getElementById('recentTx').innerHTML=h||'Wala pa.'; var ph=''; for(var p2=0;p2<txs.length;p2++){ if(txs[p2].status!=='pending') continue; ph+='<div class="box"><b>'+esc(txs[p2].person)+'</b> - P'+fmt(txs[p2].amount)+'<br>'; if(curRole==='AUDITOR') ph+='<button class="green" onclick="approveTx(\''+txs[p2].id+'\')">APPROVE</button> <button class="red" onclick="rejectTx(\''+txs[p2].id+'\')">REJECT</button>'; else ph+='Si AUDITOR lang'; ph+='</div>'; } document.getElementById('pendingList').innerHTML=ph||'Wala pang pending.'; var mh=''; var mbs=arr(MB); for(var m=0;m<mbs.length;m++){ mh+='<div class="row"><span>'+esc(mbs[m].name)+'</span><button class="red" onclick="deleteMember(\''+mbs[m].id+'\')">DELETE</button></div>'; } document.getElementById('memberList').innerHTML=mh||'Wala pa.'; var pub=[]; for(var q=0;q<txs.length;q++){ if(txs[q].status==='approved') pub.push(txs[q]); } var ph2=''; for(var q2=0;q2<pub.length;q2++){ ph2+='<div class="row"><span>'+esc(pub[q2].category)+' - '+esc(pub[q2].person)+'</span><b>P'+fmt(pub[q2].amount)+'</b></div>'; } document.getElementById('publicList').innerHTML=ph2||'Wala pang approved.'; document.getElementById('publicTotals').textContent='Balance: P'+fmt(si-so); }
function approveTx(id){ if(curRole!=='AUDITOR') return alert('AUDITOR lang!'); db.ref('transactions/'+id).update({status:'approved'}); }
function rejectTx(id){ if(curRole!=='AUDITOR') return alert('AUDITOR lang!'); var reason=prompt('Bakit ni-reject?'); db.ref('transactions/'+id).update({status:'rejected',rejectReason:reason||''}); }
function deleteMember(id){ if(confirm('Delete member?')) db.ref('members/'+id).remove(); }
function saveTx(){ if(!fOK) return alert('Hindi naka-connect!'); var a=Number(document.getElementById('txAmount').value); var p=document.getElementById('txPerson').value.trim(); if(!a||a<=0) return alert('Lagyan ng halaga!'); if(!p) return alert('Lagyan ng pangalan!'); db.ref('transactions').push({amount:a,type:txType,category:document.getElementById('txCategory').value,person:p,note:document.getElementById('txNote').value,status:'pending',timestamp:Date.now(),by:curEmail}); alert('Na-save - PENDING'); document.getElementById('txAmount').value=''; document.getElementById('txPerson').value=''; }
function addMember(){ var n=document.getElementById('memberName').value.trim(); var c=document.getElementById('memberContact').value.trim(); if(!n) return alert('Lagyan ng pangalan!'); db.ref('members').push({name:n,contact:c}); alert('Na-add '+n); document.getElementById('memberName').value=''; }
function saveSettings(){ var n=document.getElementById('settingGcash').value.trim(); var nm=document.getElementById('settingGcashName').value.trim(); db.ref('settings/gcash').set({gcashNumber:n,gcashName:nm}); alert('Na-save!'); }
function downloadBackup(){ var data={transactions:TX,members:MB,settings:ST,version:'v22'}; var b=new Blob([JSON.stringify(data)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='backup.json'; a.click(); }
function wipeAll(){ if(curRole!=='AUDITOR') return alert('AUDITOR lang!'); if(!confirm('Sigurado? Mabubura LAHAT!')) return; db.ref('transactions').remove(); db.ref('members').remove(); alert('Nabura na!'); }
try{
var cfg={apiKey:"AIzaSyD8XqSU5tlx5gVKBNJjIvrkfqwiTbaeSuw",authDomain:"stoninochapelfinance.firebaseapp.com",databaseURL:"https://stoninochapelfinance-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"stoninochapelfinance",storageBucket:"stoninochapelfinance.firebasestorage.app",messagingSenderId:"633724409478",appId:"1:633724409478:web:a01f4e934d836ce3c82307"};
firebase.initializeApp(cfg);
auth=firebase.auth();
db=firebase.database();
fOK=true;
document.getElementById('debugMsg').textContent='Firebase: LOADED OK - Pwede na mag-login';
auth.onAuthStateChanged(function(u){ if(!u) return; curEmail=u.email; var em=u.email.toLowerCase(); if(em.indexOf('treasurer')!==-1) curRole='TREASURER'; else if(em.indexOf('auditor')!==-1) curRole='AUDITOR'; else curRole='MEMBER'; document.getElementById('loginPage').style.display='none'; document.getElementById('mainApp').classList.remove('hidden'); document.getElementById('userEmail').textContent=u.email; document.getElementById('userRoleLabel').textContent='Role: '+curRole; loadData(); showPage('Dashboard'); });
}catch(e){ document.getElementById('debugMsg').textContent='Firebase error: '+e.message; }
</script>
</body>
</html>
