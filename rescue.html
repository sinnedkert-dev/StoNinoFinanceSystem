<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RESCUE - Resibo</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>body{font-family:Arial;padding:12px}img{width:100%;border-radius:10px} .card{border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:10px}</style>
</head><body>
<h2>🛟 RESCUE - Resibo lang - Kahit sira main App</h2>
<p><small>Login ka gamit yung Treasurer / Auditor mo. Diretsyo to sa Firebase - hindi dumadaan sa main system mo.</small></p>
<input id="email" placeholder="treasurer@stonino.com" style="width:100%;padding:10px;margin:5px 0">
<input id="pass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:5px 0">
<button onclick="login()" style="width:100%;padding:12px;background:#7f1d1d;color:#fff;border:none;border-radius:8px;font-weight:bold">LOGIN AT IPAKITA RESIBO</button>
<div id="out" style="margin-top:15px">Hindi pa naka-login.</div>
<script>
var cfg={apiKey:"AIzaSyD8XqSU5tlx5gVKBNJjIvrkfqwiTbaeSuw",authDomain:"stoninochapelfinance.firebaseapp.com",databaseURL:"https://stoninochapelfinance-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"stoninochapelfinance"};
firebase.initializeApp(cfg);
function login(){
  var e=document.getElementById('email').value, p=document.getElementById('pass').value;
  firebase.auth().signInWithEmailAndPassword(e,p).then(function(){
    document.getElementById('out').innerHTML='Naglo-load galing Firebase...';
    firebase.database().ref('transactions').once('value').then(function(snap){
      var val=snap.val()||{}; var arr=Object.values(val);
      var mayResibo=arr.filter(function(t){return t.receipt && t.receipt.length>10});
      var html='<b>Total: '+arr.length+' | May resibo sa Firebase: '+mayResibo.length+'</b><br><small>Kung 0, ibig sabihin hindi talaga na-save sa Firebase yung mga luma. Yung bago lang na may preview bago mag-ADD ang may resibo.</small>';
      mayResibo.forEach(function(t){
        html+='<div class="card"><b>#'+String(t.displayNo||0)+' - ₱'+(t.amount||0)+' - '+(t.category||'')+'</b><br><small>'+(t.note||'')+' | '+(t.status||'')+'</small><br><img src="'+t.receipt+'"><br><a href="'+t.receipt+'" target="_blank">Buksan / Download Resibo</a></div>';
      });
      document.getElementById('out').innerHTML=html||'Walang resibo sa Firebase.';
    });
  }).catch(function(err){ alert('AYAW MAG-LOGIN: '+err.message); });
}
</script></body></html>
